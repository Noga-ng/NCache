name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: Validate Composer
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: PHP CS Fixer
        run: vendor/bin/php-cs-fixer check --diff

      - name: PHPStan
        run: vendor/bin/phpstan analyse Src --level=9

  tests:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      memcached:
        image: memcached:latest
        ports:
          - 11211:11211

    strategy:
      fail-fast: false
      matrix:
        php-version:
          - '8.1'
          - '8.2'
          - '8.3'
          - '8.4'
          - '8.5'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: json,pdo_sqlite,sqlite3,redis,memcached
          coverage: none

      - name: Update composer
        run: composer update

      - name: Validate composer
        run: composer validate --strict
      
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Check Redis
        run: |
          php -r '
          $redis = new Redis();
          $redis->connect("127.0.0.1", 6379);
          var_dump($redis->ping());
          '

      - name: Check Memcached
        run: |
          php -r '
          $m = new Memcached();
          $m->addServer("127.0.0.1", 11211);
          $m->set("ci-test", "ok", 30);
          var_dump($m->get("ci-test"));
          '

      - name: PHPUnit
        run: vendor/bin/phpunit Tests/Units/