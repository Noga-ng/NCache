name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: json,pdo_sqlite,sqlite3,redis,memcached
          coverage: none

      - name: PHP version
        run: php -v

      - name: Validate Composer
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: PHP syntax check
        run: |
          find Src Tests -name "*.php" -print0 \
            | xargs -0 -n1 php -l

      - name: PHP CS Fixer
        run: vendor/bin/php-cs-fixer check --diff

      - name: PHPStan
        run: vendor/bin/phpstan analyse Src --level=9

  tests:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      memcached:
        image: memcached:latest
        ports:
          - 11211:11211

    strategy:
      fail-fast: false

      matrix:
        php-version:
          - '8.1'
          - '8.2'
          - '8.3'
          - '8.4'
          - '8.5'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: json,pdo_sqlite,sqlite3,redis,memcached
          coverage: none

      - name: PHP version
        run: php -v

      - name: Validate Composer
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Check Redis
        run: |
          php -r '
          $redis = new Redis();
          $redis->connect("127.0.0.1", 6379);

          if ($redis->ping() === false) {
              exit(1);
          }

          echo "Redis OK\n";
          '

      - name: Check Memcached
        run: |
          php -r '
          $memcached = new Memcached();
          $memcached->addServer("127.0.0.1", 11211);

          if (!$memcached->set("ci-test", "ok", 30)) {
              exit(1);
          }

          if ($memcached->get("ci-test") !== "ok") {
              exit(1);
          }

          echo "Memcached OK\n";
          '

      - name: PHPUnit
        run: vendor/bin/phpunit Tests/Units/